name: ui-recovery-status
on:
  push:
    branches: [ui-rehaul-buffer-20260912]
    paths: [.github/workflows/ui-recovery-status.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-rehaul-buffer-20260912
          fetch-depth: 0
      - name: Move recovery status outside hidden view
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('console/workspace.html')
          s=p.read_text()
          root='    <div class="compat-only legacy-controls" aria-hidden="true">\n'
          if root not in s:
              raise SystemExit('compat recovery root not found')
          marker='      <span id="taskHint" class="sr-only" role="status">Review a Mandate before running paid work.</span>\n'
          if 'id="taskHint" class="sr-only"' not in s:
              s=s.replace(root,root+marker,1)
          old='<div class="actions"><button id="runTask" class="primary" type="submit">Run paid task</button><span id="taskHint" class="subtle">Review a Mandate before running paid work.</span></div>'
          new='<div class="actions"><button id="runTask" class="primary" type="submit">Run paid task</button></div>'
          if old not in s:
              raise SystemExit('task hint action anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit clean recovery status fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ui-recovery-status.yml
          git add console/workspace.html
          git commit -m "fix(ui): keep recovery task status observable"
          git push origin HEAD:ui-rehaul-buffer-20260912
