name: ci

on:
  push:
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @mandate/gateway
      # Hermetic by design: the suite spawns its own service with pinned
      # test doubles and needs no secrets, no device, no network.
      - run: npm test -w @mandate/gateway
