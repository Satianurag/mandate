name: ui-skiplink-fix
on:
  push:
    branches: [ui-rehaul-buffer-20260912]
    paths: [.github/workflows/ui-skiplink-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-rehaul-buffer-20260912
          fetch-depth: 0
      - name: Use standard off-canvas skip-link positioning
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('console/workspace.css')
          s=p.read_text()
          old='.skip{position:fixed;left:12px;top:-60px;'
          new='.skip{position:absolute;left:12px;top:-60px;'
          if old not in s:
              raise SystemExit('skip-link CSS anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit clean skip-link fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ui-skiplink-fix.yml
          git add console/workspace.css
          git commit -m "fix(ui): use off-canvas skip-link positioning"
          git push origin HEAD:ui-rehaul-buffer-20260912
