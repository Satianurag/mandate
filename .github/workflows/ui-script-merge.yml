name: ui-script-merge
on:
  push:
    branches: [ui-rehaul-buffer-20260912]
    paths: [.github/workflows/ui-script-merge.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-rehaul-buffer-20260912
          fetch-depth: 0
      - name: Move product polish into served agent bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('console/workspace.html')
          agents = Path('console/agents.js')
          text = html.read_text()
          marker = '// Presentation-only product polish.'
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('presentation script marker not found')
          start = text.rfind('<script>', 0, pos)
          end = text.find('</script>', pos)
          if start < 0 or end < 0:
              raise SystemExit('presentation script block not found')
          script = text[start + len('<script>'):end].strip()
          text = text[:start] + text[end + len('</script>'):]
          html.write_text(text)
          js = agents.read_text()
          if marker not in js:
              agents.write_text(js.rstrip() + '\n\n' + script + '\n')
          PY
          node --check console/agents.js
          git diff --check
      - name: Commit assembled UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add console/workspace.html console/agents.js
          git commit -m "fix(ui): run product polish from served agent bundle"
          git push origin HEAD:ui-rehaul-buffer-20260912
