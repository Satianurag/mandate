name: ui-compat-fix
on:
  push:
    branches: [ui-rehaul-buffer-20260912]
    paths: [.github/workflows/ui-compat-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-rehaul-buffer-20260912
          fetch-depth: 0
      - name: Apply product and recovery UI fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          html_path=Path('console/workspace.html'); css_path=Path('console/workspace.css'); text=html_path.read_text()
          text=text.replace('<h1 id="loginTitle">Open your local workspace</h1>\n    <p class="lead">Launch the workspace from the Mandate CLI. Your local session stays on this machine.</p>','<h1 id="loginTitle">Let the agent work.<br>Keep spending controlled.</h1>\n    <p class="lead">Open the authenticated local workspace. Payment keys stay behind the broker, and paid work stays inside reviewed testnet limits.</p>')
          if 'id="createAgentShortcut"' not in text:
              needle='          <p class="page-subtitle">Choose a specialist, then give it the outcome you want. Mandate handles the permitted paid tools underneath.</p>\n        </div>\n      </div>'
              replacement='          <p class="page-subtitle">Choose a specialist, then give it the outcome you want. Mandate handles the permitted paid tools underneath.</p>\n        </div>\n        <button class="secondary" id="createAgentShortcut" type="button">Create agent</button>\n      </div>'
              if needle not in text: raise SystemExit('task page header anchor not found')
              text=text.replace(needle,replacement,1)
          home=base64.b64decode('').decode()
          hp=text.index('<section id="homeView"'); hs=text.index('      <div class="compat-only" aria-hidden="true">',hp); he=text.index('    </section>\n\n    <section class="panel agents-panel',hs); text=text[:hs]+home+text[he:]
          recovery=base64.b64decode('').decode()
          fp=text.index('<footer class="workspace-footer">'); rs=text.index('    <div class="compat-only" aria-hidden="true">',fp); rem='    </div>\n  </div>\n</main>'; re=text.index(rem,rs); text=text[:rs]+recovery+text[re:]; html_path.write_text(text)
          css=css_path.read_text(); base='[hidden],.compat-only{display:none!important}'; conditional='[hidden],.compat-only{display:none!important}body:not(.agent-mode) .compat-only{display:block!important}body:not(.agent-mode) .agent-only{display:none!important}'
          if 'body:not(.agent-mode) .compat-only' not in css:
              if base not in css: raise SystemExit('compatibility visibility anchor not found')
              css=css.replace(base,conditional,1)
          css=css.replace('grid-template-areas:"eyebrow" "title" "desc" "meta" "actions";padding:15px','grid-template-areas:"eyebrow" "title" "desc" "tools" "allowance" "actions";padding:15px')
          refine=base64.b64decode('').decode()
          if '/* Buffer-style product refinements 2026-09-12 */' not in css: css+='\n'+refine
          css_path.write_text(css)
          PY
          git diff --check
      - name: Commit clean UI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ui-compat-fix.yml
          git add console/workspace.html console/workspace.css
          git commit -m "fix(ui): preserve recovery flow and polish mobile layout"
          git push origin HEAD:ui-rehaul-buffer-20260912
