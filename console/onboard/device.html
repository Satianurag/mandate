<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Connect device · Mandate</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="stylesheet" href="../css/app.css?v=3">
</head>
<body class="onboard">
  <header class="onboard-top">
    <a class="mark" href="../index.html">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#3B82F6"/><rect x="8.2" y="11" width="15.6" height="10.8" rx="1.6" fill="none" stroke="#fff" stroke-width="1.7"/><path d="M9 12.4 16 17l7-4.6" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span class="mark-name">Mandate</span>
    </a>
    <nav class="steps"><span class="on">Device</span><span class="sep">›</span><span>Envelope</span><span class="sep">›</span><span>Policy</span><span class="sep">›</span><span>Sign</span></nav>
    <div class="onboard-help"><a href="../app/evidence.html">Help</a></div>
  </header>
  <div class="progress"><i style="width:25%"></i></div>
  <div class="split">
    <section class="split-form">
      <a class="back" href="welcome.html">‹ Welcome</a>
      <h1>First, connect the device that signs the envelope</h1>
      <p class="sub">Your Ledger holds the mandate. The session key stays sealed — named here, never shown. <a href="../app/evidence.html">Learn more</a></p>

      <div class="device-grid">
        <input type="radio" name="device" id="nano" checked>
        <label class="device-card" for="nano">
          <svg width="28" height="18" viewBox="0 0 28 18" aria-hidden="true"><rect x="1" y="4" width="26" height="10" rx="2" fill="none" stroke="#111" stroke-width="1.6"/><circle cx="7" cy="9" r="1.4" fill="#111"/></svg>
          <div class="name">Ledger Nano S+</div>
          <div class="meta">Ready to sign</div>
        </label>
        <input type="radio" name="device" id="ring">
        <label class="device-card" for="ring">
          <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8" fill="none" stroke="#111" stroke-width="1.6"/><circle cx="11" cy="11" r="3" fill="#111"/></svg>
          <div class="name">Key Ring session</div>
          <div class="meta">Named, sealed</div>
        </label>
      </div>

      <div class="split-foot">
        <a class="btn btn-blue btn-wide" href="envelope.html">Continue</a>
        <a class="btn-skip" href="../index.html" style="margin-top:10px">Skip for now</a>
      </div>
    </section>
    <aside class="split-scene" aria-hidden="true">
      <div class="wave"></div>
      <div class="orb">
        <svg viewBox="0 0 32 32" width="36" height="36"><rect x="8.2" y="11" width="15.6" height="10.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9 12.4 16 17l7-4.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </div>
    </aside>
  </div>
</body>
</html>
