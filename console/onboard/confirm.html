<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c9cdd4">
  <title>Confirm on device · Mandate</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="stylesheet" href="../css/app.css?v=3">
</head>
<body class="wait">
  <header class="wait-bar">
    <a class="mark" href="../index.html">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#3B82F6"/><rect x="8.2" y="11" width="15.6" height="10.8" rx="1.6" fill="none" stroke="#fff" stroke-width="1.7"/><path d="M9 12.4 16 17l7-4.6" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span class="mark-name">Mandate</span>
    </a>
    <nav class="wait-steps">
      <span>Device</span>
      <span>Envelope</span>
      <span>Policy</span>
      <span class="on">Sign</span>
    </nav>
    <a class="modal-x" href="policy.html" aria-label="Close">✕</a>
  </header>

  <div class="wait-card">
    <div class="device-mark" aria-hidden="true">
      <svg width="36" height="24" viewBox="0 0 36 24"><rect x="1" y="6" width="34" height="12" rx="3" fill="none" stroke="#111" stroke-width="1.8"/><circle cx="9" cy="12" r="1.6" fill="#111"/></svg>
    </div>
    <h1>Approve mandate using the device</h1>
    <p>We’ve sent the envelope to your Nano S+. Tap it to sign.</p>
    <div class="spinner" aria-hidden="true"></div>
    <p class="do-not">Please do not close this page while we wait for the signature.</p>
    <div class="args" style="text-align:left">
      <div class="row"><span>Amount</span><strong>$5.00 USDC</strong></div>
      <div class="row"><span>Pay to</span><strong class="mono">0x3D4A-5d71</strong></div>
      <div class="row"><span>Network</span><strong>Base Sepolia</strong></div>
    </div>
    <a class="wait-ghost" href="done.html">I’ve signed on the device →</a>
  </div>
</body>
</html>
