# Reviewed operator configuration. The workspace creates fresh salt/storage on save.
# Never copy an old funded channel into a new authority without reconciliation.
version: 2
network: "eip155:84532"
rpcUrl: "https://sepolia.base.org"
serviceUrl: "http://127.0.0.1:8405/analytics"
asset: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
# Set all three from independently verified operator/merchant identities.
operatorAddress: "REQUIRED_LEDGER_ADDRESS"
receiver: "REQUIRED_MERCHANT_ADDRESS"
receiverAuthorizer: "REQUIRED_FACILITATOR_AUTHORIZER"
withdrawDelay: 86400
# Explicit UTC expiry; this is broker-enforced, not escrow withdrawal timing.
expiresAt: "REQUIRED_UTC_ISO_EXPIRY"
ceilingBaseUnits: "5000000"
perCallBaseUnits: "10000"
windowBaseUnits: "100000"
windowMs: 3600000
salt: "REQUIRED_FRESH_BYTES32"
sessionKey: "mandate-session"
derivationPath: "44'/60'/0'/0/0"
storageRoot: "./state/operator-mandate"
