[package]
name = "x402-payments"
version = "0.1.0"
description = "Map USDC / x402 batch-settlement logs on Base mainnet"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
substreams = "0.6"
substreams-ethereum = "0.10"
prost = "0.13"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
